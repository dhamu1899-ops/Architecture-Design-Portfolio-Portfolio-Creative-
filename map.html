<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STACKLY — Fairlands, Salem location map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #e9e4dc; }
  #map { position: absolute; inset: 0; background: #e9e4dc url("assets/img/stackly-map.webp") center / cover no-repeat; }
  .stackly-pin { display: block; }
  .stackly-card {
    background: #fff; border: 1px solid #e5d7cb; border-left: 6px solid #996830;
    border-radius: 8px; box-shadow: 0 3px 12px rgba(41,31,30,.28);
    padding: 8px 14px; white-space: nowrap; font-family: Arial, Helvetica, sans-serif;
  }
  .stackly-card b { display: block; font-size: 15px; color: #291f1e; letter-spacing: .4px; }
  .stackly-card span { font-size: 12px; color: #6b625f; }
  .map-cta {
    position: absolute; right: 12px; bottom: 26px; z-index: 1000;
    padding: 8px 14px; border-radius: 4px; background: #fff; border: 1px solid #e3d8cc;
    box-shadow: 0 2px 8px rgba(41,31,30,.2); font: 700 13px/1 Arial, sans-serif;
    color: #291f1e; text-decoration: none;
  }
  .map-cta:hover { background: #291f1e; color: #fff; }
</style>
</head>
<body>
<div id="map"></div>
<a class="map-cta" href="https://www.openstreetmap.org/?mlat=11.6643&amp;mlon=78.1460#map=15/11.6643/78.1460"
   target="_blank" rel="noopener">View larger map ↗</a>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var LAT = 11.6643, LON = 78.1460;
  var map = L.map('map', { zoomControl: true, scrollWheelZoom: true, attributionControl: true })
    .setView([LAT, LON], 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  var icon = L.divIcon({
    className: '',
    html: '<svg width="52" height="66" viewBox="0 0 52 66" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M26 2 C11 2 0 14 0 29 c0 21 26 35 26 35 s26-14 26-35 C52 14 41 2 26 2z" fill="#996830" stroke="#fff" stroke-width="4"/>' +
          '<circle cx="26" cy="28" r="10" fill="#fff"/></svg>',
    iconSize: [52, 66],
    iconAnchor: [26, 62]
  });
  L.marker([LAT, LON], { icon: icon }).addTo(map)
    .bindPopup('<div class="stackly-card"><b>STACKLY</b><span>2nd Floor, Amma Complex, Fairlands, Salem, Tamil Nadu 636016</span></div>')
    .openPopup();
</script>
</body>
</html>
